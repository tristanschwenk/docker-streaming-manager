services:
  # --- VPN (Le tunnel sécurisé) ---
  vpn:
    image: qmcgaw/gluetun
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_USER=A4DhMJcDg
      - OPENVPN_PASSWORD=01KMEC606GGD9Y16CYRRAS7XDQ
      - TZ=Europe/Paris
      - OPENVPN_CUSTOM_CONFIG=/gluetun/client.conf
      - DOT=off
    volumes:
      - ./docker-config/vpn:/gluetun
    ports:
      - 9091:9091 # Transmission Web UI
      - 8989:8989 # Sonarr
      - 7878:7878 # Radarr
      - 9696:9696 # Prowlarr
    restart: always

  # --- DOWNLOADER (Derrière le VPN) ---
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./docker-config/transmission:/config
      - ./data:/data
    depends_on:
      - vpn
    restart: always

  # --- INDEXEURS ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./docker-config/prowlarr:/config
    depends_on:
      - vpn
    restart: always

  # --- GESTIONNAIRES ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./docker-config/radarr:/config
      - ./data:/data
    depends_on:
      - vpn
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "container:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./docker-config/sonarr:/config
      - ./data:/data
    depends_on:
      - vpn
    restart: always
  jellyfin:
    image: jellyfin/jellyfin
    #ports:
    #- 8097:8096
    container_name: jellyfin
    user: 1000:1000
    network_mode: "host"
    volumes:
      - ./docker-config/jellyfin/config:/config
      - ./docker-config/jellyfin/cache:/cache
      - type: bind
        source: ../../
        target: /media
    restart: "unless-stopped"
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"
