version: "2.1"
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /Users/tristanschwenk/Documents/Code/docker-streaming-manager/radarr/config:/config
      - /Users/tristanschwenk/Documents/Code/docker-streaming-manager/content/movies:/movies #optional
      - /Users/tristanschwenk/Documents/Code/docker-streaming-manager/content/downloads:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true #optional
      - RUN_OPTS= #optional
    volumes:
      - /Users/tristanschwenk/Documents/Code/docker-streaming-manager/jacket/config:/config
      - /Users/tristanschwenk/Documents/Code/docker-streaming-manager/content/downloads:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - TRANSMISSION_WEB_HOME= #optional
      - USER= #optional
      - PASS= #optional
      - WHITELIST= #optional
      - PEERPORT= #optional
      - HOST_WHITELIST= #optional
    volumes:
      - ./transmission/data:/config
      - /Users/tristanschwenk/Documents/Code/docker-streaming-manager/content/downloads:/downloads
      - ./transmission/folder:/watch
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
